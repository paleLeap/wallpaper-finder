<!DOCTYPE html>
<meta charset="utf-8">
<title>Wallpaper scanner</title>
<link rel="stylesheet" href="scanner.css">

<!-- wallpaper-scanner. Three stages in one window.

     There is no titlebar, so the window's own furniture is drawn here: the
     drag surface is the whole panel, the resize grips are the eight strips
     round the edge, and every button that a titlebar would own is in the top
     strip of whichever stage is showing.

     No `title` attributes anywhere. WebKit turns one into a black GTK tooltip
     in the system font that no stylesheet here can reach. `aria-label` names
     a control and draws nothing.
     (door/01-ui-ux/webkit-title-tooltips.md, 2026-08-20) -->

<div id="frame" data-stage="bar">

  <!-- ============ stage one: what to search ============ -->
  <section id="bar" class="stage">

    <!-- A strip of its own rather than a square floating in the corner: the
         floating one sat on top of the Search button and could not be pressed.
         Also the window's drag handle, since there is no titlebar. -->
    <div id="bartop">
      <button class="wbtn" id="barmin" aria-label="Minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <button class="wbtn" id="barmax" aria-label="Maximize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="wbtn" id="barclose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <div class="barrow">
      <div class="pane" id="sourcepane">
        <h2>Sources</h2>
        <div class="list" id="sourcelist"></div>
      </div>

      <div class="pane" id="themepane">
        <h2>Themes</h2>
        <!-- Anything typed here joins the ticked pills in the same search
             string, so it reaches every source at once. No placeholder: he
             said it does not need to say "Search", and a grey word sitting in
             an empty box is a thing to read rather than a thing to use.
             aria-label names it without drawing a WebKit tooltip. -->
        <input id="themesearch" type="text" spellcheck="false"
               autocomplete="off" autocorrect="off"
               aria-label="Extra words to search for">
        <div class="list" id="themelist"></div>
      </div>

      <div class="endcol">
        <button id="searchbtn" class="go">Search</button>
        <!-- The counterpart to the record. It carries its own count so what is
             about to be thrown away is visible before it is. -->
        <button id="forgetbtn" class="flat">Forget what I've seen</button>
      </div>
    </div>

    <!-- A strip of its own under the panes rather than a fourth column: the
         themes list is the one that grows now it comes from the sites, and a
         column taken out of the row would have shrunk it. Built by the host
         like the other two lists, so the palette is written down in one place
         -- and it has to be, because wallhaven only accepts its own fixed
         swatches and answers a total of 0 to anything else (measured
         2026-08-26). -->
    <div class="pane" id="colourpane">
      <h2>Main colour</h2>
      <div id="colourlist"></div>
    </div>
  </section>

  <!-- ============ stage two: how many ============ -->
  <section id="ask" class="stage">
    <h1>How many?</h1>
    <input id="howmany" type="text" inputmode="numeric" value="10" spellcheck="false"
           aria-label="How many wallpapers to look for">
    <p class="hint">No limit. Stop it whenever you like.</p>
    <div class="askrow">
      <button id="askcancel" class="flat">Back</button>
      <button id="askgo" class="go">Confirm</button>
    </div>
  </section>

  <!-- ============ stage three: the results ============ -->
  <section id="grid" class="stage">

    <div id="strip">
      <div id="status">Nothing yet</div>

      <button class="rollbtn" id="rollbtn" aria-label="Roll up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>

      <div id="stripright">
        <button id="submitbtn" class="go small" hidden>Submit selections</button>
        <button id="stopbtn" class="stop">Stop</button>
        <button class="xbtn inline" id="gridclose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </div>

    <!-- The only scrolling region. Four across, and it fills as previews
         arrive rather than all at once. -->
    <div id="results"></div>
  </section>

  <!-- What the X in the results window opens. Closing throws the previews
       away, so it is asked about rather than done. -->
  <div id="confirm" hidden>
    <div id="confirmpanel">
      <p id="confirmtext">Stop search and delete thumbnails?</p>
      <div class="askrow">
        <button id="confirmno" class="flat">No</button>
        <button id="confirmyes" class="heavy">Yes</button>
      </div>
    </div>
  </div>

</div>

<div class="grip n"  data-edge="n"></div>
<div class="grip s"  data-edge="s"></div>
<div class="grip w"  data-edge="w"></div>
<div class="grip e"  data-edge="e"></div>
<div class="grip nw" data-edge="nw"></div>
<div class="grip ne" data-edge="ne"></div>
<div class="grip sw" data-edge="sw"></div>
<div class="grip se" data-edge="se"></div>

<script src="scanner.js"></script>
